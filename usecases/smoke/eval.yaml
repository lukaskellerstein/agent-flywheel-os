# The smoke evaluation (spec 02 decision 19): Codex answers each question
# from the knowledge base, and two deterministic judges make the reward, so
# no judge calls a model. The job's model name (enmaas-glm-5-3) reaches
# Codex as --model, through the cluster's LiteLLM gateway. GLM 5.3, not
# gpt-5-mini: EnMaaS stopped serving GPT on 2026-10-16 (decision 19).
#
# Version 3 (2026-11-05): the harness's builtin judges (C22) in place of an
# inline check, a numeric one and a pass/fail one, and thresholds (C20) for
# the three rules of the module's release gate: the mean reward, every
# judge at its threshold, every task's reward.
name: smoke
description: A product support agent answering questions over resources/kb

execution:
  mode: case
  prompt: |
    You answer product questions for a {product} user. Use only the
    knowledge base in resources/kb/ and the files beside this prompt.
    Question: {question}
    Write your answer, in at most three sentences, to output/answer.md.
  # GLM 5.3 takes about 26 s to its first token and reasons at length.
  timeout: 900

models:
  skill: enmaas-glm-5-3

runner:
  type: codex
  # The pod is the boundary: Codex's own workspace-write sandbox needs
  # kernel features a restricted OpenShift pod does not always give.
  permission_mode: bypassPermissions
  settings:
    model_provider: gateway
    model_providers:
      gateway:
        name: gateway
        base_url: http://gateway.agent-flywheel.svc:4000/v1
        env_key: OPENAI_API_KEY
        wire_api: responses
    # Codex has no metadata for a gateway alias.
    model_context_window: 128000
  env:
    # The gateway takes no key inside the cluster; Codex still wants the
    # variable its provider names to be set.
    OPENAI_API_KEY: gateway-takes-no-key

dataset:
  path: tasks
  schema: |
    One task per file in tasks/: input.question (the user's question) and
    input.product; expected.must_mention lists the facts the answer names.
    A task's own files (a screen capture) sit beside the prompt.
  workspace:
    # A string here is a path in each task's own folder; a file every task
    # shares is a {dest, source} pair.
    files:
      - dest: resources/kb
        source: resources/kb

outputs:
  - path: output
    schema: output/answer.md holds the answer, in markdown

judges:
  - name: must_mention
    description: The share of the task's expected facts the answer names
    builtin: contains
    score_range: [0, 1]
    arguments:
      file: output/answer.md
      # Each task's expected.must_mention; an entry may list alternatives.
      items_from: must_mention
      partial: true
  - name: short
    description: The answer stays within 80 words, as the prompt asks
    builtin: length
    arguments:
      file: output/answer.md
      min_words: 1
      max_words: 80

reward:
  weights:
    must_mention: 0.7
    short: 0.3
  # A long answer lowers the reward; it does not zero it.
  gate: false

thresholds:
  reward:
    min_mean: 0.5
    min_per_case: 0.5
  must_mention:
    min_mean: 0.8
  short:
    min_pass_rate: 1.0
