# The TrustyAI operator runs in `opendatahub`, so its pod pulls our operator
# image across namespaces. Pull only: the group gets no other right here.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opendatahub-image-puller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:opendatahub
