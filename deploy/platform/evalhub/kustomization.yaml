# The EvalHub server, spec 01 phase 1 step 4, run by ODH's TrustyAI module.
# Needs deploy/platform/dsc (trustyai Managed) and deploy/platform/mlflow,
# and the Secret evalhub-db, made on the cluster (postgres.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-flywheel
resources:
  - provider-agent-eval-harness.yaml
  - postgres.yaml
  - evalhub.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: agent-flywheel
