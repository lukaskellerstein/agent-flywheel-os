# One server for agent-flywheel only (single tenancy, as in openshift-eval):
# its job pods run here. The dashboard's eval-hub page finds it as the EvalHub
# of the selected project.
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
spec:
  tenancy: single
  # PostgreSQL of postgres.yaml: jobs outlive a restart. The operator's
  # sqlite lived in the server's memory.
  database:
    type: postgresql
    secret: evalhub-db
  # The CRD's default three, the built-in ones phase 1's DoD runs, and C11's
  # agent-eval-harness from provider-agent-eval-harness.yaml in this
  # namespace, read from its ConfigMap at every start.
  providers:
    - garak
    - garak-kfp
    - lm-evaluation-harness
    - agent-eval-harness
  env:
    # ODH's MLflow (deploy/platform/mlflow), which serves under /mlflow. The
    # operator adds its CA and a token; the job pods send this namespace as
    # their MLflow workspace.
    - name: MLFLOW_TRACKING_URI
      value: https://mlflow.opendatahub.svc:8443/mlflow
