# Decision 5: the dashboard and TrustyAI (EvalHub) Managed, every other
# module Removed. MLflow Managed too: phase 1 step 5 tries ODH's MLflow first,
# because EvalHub injects MLFLOW_WORKSPACE into every job pod.
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    dashboard:
      managementState: Managed
      maasConsumerPortal:
        managementState: Removed
    trustyai:
      managementState: Managed
      eval:
        lmeval:
          # Built-in providers fetch their datasets; no task runs model code.
          permitOnline: allow
          permitCodeExecution: deny
    mlflowoperator:
      managementState: Managed
    aigateway:
      managementState: Removed
    aipipelines:
      managementState: Removed
    feastoperator:
      managementState: Removed
    kserve:
      managementState: Removed
    kueue:
      managementState: Removed
    llamastackoperator:
      managementState: Removed
    mcplifecycleoperator:
      managementState: Removed
    modelregistry:
      managementState: Removed
    ogx:
      managementState: Removed
    ray:
      managementState: Removed
    sparkoperator:
      managementState: Removed
    trainer:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    workbenches:
      managementState: Removed
