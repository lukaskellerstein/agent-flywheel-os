# One replica, replaced, never two at once: the registry serialises the
# writes to a use case inside its process (services/flywheel-api,
# registry.py), so two pods could both write the same version number.
#
# The image is the ImageStream tag of build.yaml; the trigger annotation
# swaps in its digest and rolls the pod after each build. Until the first
# build the pod waits in ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flywheel-api
  labels:
    app.kubernetes.io/name: flywheel-api
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"flywheel-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flywheel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flywheel-api
    spec:
      # The Service flywheel-api would put FLYWHEEL_API_PORT=tcp://… into
      # the pod, the name of the API's own port setting (it crashed on
      # 2026-10-16). Nothing here uses service links.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/agent-flywheel/flywheel-api:latest
          # The claim's ConfigMap (BUCKET_HOST, BUCKET_PORT, BUCKET_NAME,
          # BUCKET_REGION) and Secret (AWS_ACCESS_KEY_ID,
          # AWS_SECRET_ACCESS_KEY), both named like the claim. boto3 reads
          # the key from env; the API never prints it. A new or rotated key
          # needs a rollout restart.
          envFrom:
            - configMapRef:
                name: flywheel-usecases
            - secretRef:
                name: flywheel-usecases
          env:
            # NooBaa's S3 inside the cluster, plain HTTP, so no CA bundle.
            # It wins over BUCKET_HOST and BUCKET_PORT (443, HTTPS with the
            # service CA), which the claim's ConfigMap gives.
            - name: S3_ENDPOINT_URL
              value: http://s3.openshift-storage.svc:80
            # Evaluations (services/flywheel-api, evaluations.py): EvalHub
            # jobs with C11's provider, the per-task verdicts from MLflow.
            # Both are called with the caller's own token, never the pod's.
            - name: EVALHUB_URL
              value: https://evalhub.agent-flywheel.svc:8443
            - name: MLFLOW_URL
              value: https://mlflow.opendatahub.svc:8443/mlflow
            - name: FLYWHEEL_CA_FILE
              value: /etc/flywheel-api/service-ca/service-ca.crt
            # EvalHub's tenant and MLflow's workspace.
            - name: FLYWHEEL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # AI hub › Models: the gateway's own config, the ConfigMap
            # gateway-models of deploy/gateway/. An agent may use only these
            # aliases, and an evaluation only one of its agent's.
            - name: FLYWHEEL_GATEWAY_CONFIG
              value: /etc/flywheel-api/gateway/litellm.yaml
            # Start training: the loop's Job template (deploy/flywheel/),
            # created through the Kubernetes API with the caller's token,
            # so the pod's own ServiceAccount needs no right for Jobs.
            - name: FLYWHEEL_TRAINING_JOB
              value: /etc/flywheel-api/training/training-job.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          # An import holds the use case in memory, at most 256 MiB, and the
          # version before it (services/flywheel-api, files.py).
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Uploads spool here, and a git import clones here.
            - name: tmp
              mountPath: /tmp
            - name: service-ca
              mountPath: /etc/flywheel-api/service-ca
              readOnly: true
            # A whole folder, not a subPath, so a changed ConfigMap reaches it.
            - name: gateway-models
              mountPath: /etc/flywheel-api/gateway
              readOnly: true
            - name: training-job
              mountPath: /etc/flywheel-api/training
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: service-ca
          configMap:
            name: flywheel-api-service-ca
        - name: gateway-models
          configMap:
            name: gateway-models
        - name: training-job
          configMap:
            name: flywheel-training-job
