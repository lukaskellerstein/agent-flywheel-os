# The built-in `cluster-admin`, cluster-wide: Lukas wants the agent to run the
# whole cluster on its own, phase 1's operator installs included (2026-10-13).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent-cluster-admin
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: agent-flywheel
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
