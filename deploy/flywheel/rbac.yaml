# The training loop's own identity. It starts evaluations through the
# flywheel API, which forwards its token, so EvalHub checks this
# ServiceAccount: kube-rbac-proxy maps a job's create, get, list and delete
# to `evaluations.trustyai.opendatahub.io` in the X-Tenant namespace, and a
# create also needs MLflow `experiments` create and get
# (trustyai-service-operator `controllers/evalhub/configmap.go`,
# generateAuthConfigData). The loop writes its own MLflow runs and
# artifacts in this namespace's workspace, which ODH's MLflow checks against
# the same `mlflow.kubeflow.org` resources. Nothing else: no Secret, no pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flywheel-loop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flywheel-loop
rules:
  - apiGroups: ["trustyai.opendatahub.io"]
    resources: ["evaluations"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["create", "get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flywheel-loop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flywheel-loop
subjects:
  - kind: ServiceAccount
    name: flywheel-loop
