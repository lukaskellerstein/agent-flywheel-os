# The training loop on the cluster (spec 02 phase 3 steps 3 and 4): the
# runner image's build and the loop's ServiceAccount. A training run is a
# Job made from training-job.yaml, which this kustomization does not apply:
#   oc create -f deploy/flywheel/training-job.yaml
# The service CA ConfigMap of deploy/flywheel-api/ verifies MLflow.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-flywheel
resources:
  - build.yaml
  - rbac.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: agent-flywheel
